name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate SVG sources
        run: npm run validate

      - name: Generate components & assets
        run: npm run generate

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace=packages/react --access public
          npm publish --workspace=packages/vue --access public
          npm publish --workspace=packages/react-native --access public
