name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate SVG sources
        run: npm run validate

      - name: Generate components & assets
        run: npm run generate
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Verify package versions match git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { strict as assert } from 'node:assert';
          const expected = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          for (const file of ['packages/react/package.json', 'packages/vue/package.json', 'packages/react-native/package.json']) {
            const pkg = JSON.parse(await readFile(file, 'utf8'));
            assert.equal(pkg.version, expected, `${file} version must match tag v${expected}`);
            console.log(`${pkg.name}@${pkg.version} matches tag`);
          }
          NODE

      - name: Publish generated release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/composer/dist/**

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace=packages/react --access public --provenance
          npm publish --workspace=packages/vue --access public --provenance
          npm publish --workspace=packages/react-native --access public --provenance
