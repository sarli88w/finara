name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate SVG sources
        run: npm run validate

      - name: Generate components & assets
        run: npm run generate

      - name: Sync package version with git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package version to $VERSION across workspaces"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm version "$VERSION" --workspaces --no-git-tag-version --allow-same-version

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace=packages/react --access public --provenance
          npm publish --workspace=packages/vue --access public --provenance
          npm publish --workspace=packages/react-native --access public --provenance
